# Production-style stack: app + PostgreSQL + daily billing cron.
#   cp .env.example .env   # set APP_SECRET, CRON_SECRET, POSTGRES_PASSWORD
#   docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://asterpanel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/asterpanel
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      APP_URL: ${APP_URL:-}
      INSTALL_TOKEN: ${INSTALL_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asterpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: asterpanel
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterpanel"]
      interval: 5s
      timeout: 3s
      retries: 10

  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 3600
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron || true
        done

volumes:
  db-data:
